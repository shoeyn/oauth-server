server:
  port: 9000
  http2:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 200
    connection-timeout: 20000

spring:
  application:
    name: spring-auth-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authserver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

auth:
  rails:
    login-url: ${RAILS_LOGIN_URL:http://localhost:3000/login}
  server:
    issuer-url: ${AUTH_SERVER_ISSUER:http://localhost:9000}
aws:
  kms:
    enabled: ${AWS_KMS_ENABLED:true}
    endpoint: ${AWS_KMS_ENDPOINT:http://localhost:4566}
    key-alias: ${AWS_KMS_KEY_ALIAS:alias/oauth2-signing-key}
    previous-key-aliases: ${AWS_KMS_PREVIOUS_KEY_ALIASES:alias/oauth2-signing-key-previous}
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.security.oauth2: ${LOG_LEVEL_SECURITY:INFO}
    com.example.authserver: ${LOG_LEVEL_APP:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

