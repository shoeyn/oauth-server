spring:
  application:
    name: spring-auth-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authserver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      namespace: ${REDIS_NAMESPACE:session:}
      channel:
        reload: ${SPRING_DATA_REDIS_CHANNEL_RELOAD:oauth2as:clients:reload}

server:
  port: 9000
  shutdown: graceful
  forward-headers-strategy: framework
  http2:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 200
    connection-timeout: 20000
  servlet:
    session:
      cookie:
        secure: ${REQUIRE_SECURE_COOKIES:false}

auth:
  rails:
    login-url: ${RAILS_LOGIN_URL:http://localhost:3000/login}
  server:
    issuer-url: ${AUTH_SERVER_ISSUER:http://localhost:9000}
    internal-issuer-url: ${AUTH_SERVER_URL_INTERNAL:}
    accepted-audiences: ${AUTH_SERVER_ACCEPTED_AUDIENCES:}
  client:
    backchannel-logout-url: ${AUTH_CLIENT_BACKCHANNEL_LOGOUT_URL:http://localhost:8080/oidc/backchannel_logout}
    connect-timeout-ms: ${AUTH_CLIENT_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AUTH_CLIENT_READ_TIMEOUT_MS:5000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  cleanup:
    enabled: ${AUTH_CLEANUP_ENABLED:true}
    retention-days: ${AUTH_CLEANUP_RETENTION_DAYS:30}
    cron: ${AUTH_CLEANUP_CRON:0 0 2 * * *}
aws:
  kms:
    enabled: ${AWS_KMS_ENABLED:true}
    endpoint: ${AWS_KMS_ENDPOINT:http://localhost:4566}
    key-alias: ${AWS_KMS_KEY_ALIAS:alias/oauth2-signing-key}
    previous-key-aliases: ${AWS_KMS_PREVIOUS_KEY_ALIASES:alias/oauth2-signing-key-previous}
  region: ${AWS_REGION:us-east-1}
  access-key-id: ${AWS_ACCESS_KEY_ID:test}
  secret-access-key: ${AWS_SECRET_ACCESS_KEY:test}

logging:
  level:
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.springframework.security.oauth2: ${LOG_LEVEL_SECURITY:INFO}
    com.example.authserver: ${LOG_LEVEL_APP:INFO}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

