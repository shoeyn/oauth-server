services:
  redis:
    image: redis:7-alpine
    container_name: poc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  rails-app:
    build:
      context: ./rails-app
    container_name: poc-rails-app
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - RAILS_ENV=production
      - SECRET_KEY_BASE=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      redis:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.8
    container_name: poc-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=kms
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: poc-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=authserver
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d authserver"]
      interval: 3s
      timeout: 3s
      retries: 5

  client-manager:
    build:
      context: ./client-manager
    container_name: poc-client-manager
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - SPRING_AUTH_SERVER_URL=http://spring-auth-server:9000
      - ADMIN_API_KEY=secret-admin-key
    depends_on:
      - spring-auth-server

  spring-auth-server:
    build:
      context: ./spring-auth-server
    container_name: poc-spring-auth-server
    ports:
      - "9000:9000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/authserver
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - RAILS_LOGIN_URL=http://localhost:3000/login
      - AUTH_SERVER_ISSUER=http://localhost:9000
      - AWS_KMS_ENABLED=true
      - AWS_KMS_ENDPOINT=http://localstack:4566
      - AWS_KMS_KEY_ALIAS=alias/oauth2-signing-key
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rails-app:
        condition: service_started
      localstack:
        condition: service_started

  demo-client:
    build:
      context: ./demo-client
    container_name: poc-demo-client
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis://redis:6379/1
      - AUTH_SERVER_URL=http://localhost:9000
      - AUTH_SERVER_URL_INTERNAL=http://spring-auth-server:9000
      - RAILS_URL=http://rails-app:3000
      - CLIENT_PRIVATE_KEY_PATH=/app/keys/client_private_key.pem
    depends_on:
      redis:
        condition: service_healthy
      spring-auth-server:
        condition: service_started
      rails-app:
        condition: service_started

volumes:
  postgres-data:

