services:
  redis:
    image: redis:7-alpine
    container_name: poc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  rails-app:
    build:
      context: ./rails-app
    container_name: poc-rails-app
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - RAILS_ENV=production
      - SECRET_KEY_BASE=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      redis:
        condition: service_healthy

  localstack:
    image: localstack/localstack:3.8
    container_name: poc-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,kms
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-s", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  client-manager:
    build:
      context: ./client-manager
    container_name: poc-client-manager
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - S3_ENDPOINT=http://localstack:4566
      - S3_BUCKET=oauth2-clients
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      localstack:
        condition: service_started

  spring-auth-server:
    build:
      context: ./spring-auth-server
    container_name: poc-spring-auth-server
    ports:
      - "9000:9000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RAILS_LOGIN_URL=http://localhost:3000/login
      - AUTH_SERVER_ISSUER=http://localhost:9000
      - AWS_S3_ENDPOINT=http://localstack:4566
      - AWS_S3_BUCKET=oauth2-clients
      - AWS_KMS_ENABLED=true
      - AWS_KMS_ENDPOINT=http://localstack:4566
      - AWS_KMS_KEY_ALIAS=alias/oauth2-signing-key
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      redis:
        condition: service_healthy
      rails-app:
        condition: service_started
      localstack:
        condition: service_started

  demo-client:
    build:
      context: ./demo-client
    container_name: poc-demo-client
    environment:
      - REDIS_URL=redis://redis:6379/1
      - AUTH_SERVER_URL=http://spring-auth-server:9000
      - RAILS_URL=http://rails-app:3000
      - CLIENT_PRIVATE_KEY_PATH=/app/keys/client_private_key.pem
    depends_on:
      redis:
        condition: service_healthy
      spring-auth-server:
        condition: service_started
      rails-app:
        condition: service_started
    profiles:
      - demo
