plugins:
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"
    - "coverage/**/*"

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

Metrics/ClassLength:
  Max: 200

RSpec/SpecFilePathFormat:
  CustomTransform:
    OAuth2: oauth2
    OAuth2ClientKit: oauth2_client_kit
    ParOAuth2Client: par_oauth2_client


