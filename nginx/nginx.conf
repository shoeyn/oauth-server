events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance & Logging
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # Preserve all client headers for upstream logging and tracing (including underscores)
    underscores_in_headers on;
    proxy_pass_request_headers on;

    # Accommodate large OAuth 2.1 / DPoP headers (e.g. client assertions and DPoP proofs)
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    # Upstream backend - Spring Authorization Server (private Docker network)
    upstream spring_backend {
        server spring-auth-server:9000;
        keepalive 32;
    }

    server {
        listen 9000;
        server_name localhost;

        # ----------------------------------------------------------------------
        # Common Proxy Settings (Forward all client headers to Spring backend)
        # ----------------------------------------------------------------------
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Host $http_host;

        # ----------------------------------------------------------------------
        # Edge Healthcheck
        # ----------------------------------------------------------------------
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","proxy":"nginx-perimeter"}\n';
        }

        # ----------------------------------------------------------------------
        # 1. OpenID Connect Discovery & Metadata (Public)
        # ----------------------------------------------------------------------
        location /.well-known/ {
            proxy_pass http://spring_backend;
        }

        # ----------------------------------------------------------------------
        # 2. OAuth 2.1 Protocol Endpoints (Public)
        #    (/oauth2/authorize, /oauth2/token, /oauth2/par, /oauth2/jwks,
        #     /oauth2/revoke, /oauth2/introspect)
        # ----------------------------------------------------------------------
        location /oauth2/ {
            proxy_pass http://spring_backend;
        }

        # ----------------------------------------------------------------------
        # 3. UserInfo Endpoint (Public - Sender-Constrained DPoP)
        # ----------------------------------------------------------------------
        location /userinfo {
            proxy_pass http://spring_backend;
        }

        # ----------------------------------------------------------------------
        # 4. OpenID Connect RP-Initiated Logout 1.0 (Public)
        #    (/connect/logout)
        # ----------------------------------------------------------------------
        location /connect/ {
            proxy_pass http://spring_backend;
        }

        # ----------------------------------------------------------------------
        # 5. Spring Login & Error Pages (Public)
        # ----------------------------------------------------------------------
        location /login {
            proxy_pass http://spring_backend;
        }

        location /error {
            proxy_pass http://spring_backend;
        }

        # ----------------------------------------------------------------------
        # 6. Administrative Endpoints (RESTRICTED - BLOCKED AT EDGE)
        #    Next.js Client Manager must access Spring directly via internal DNS
        # ----------------------------------------------------------------------
        location /api/admin/ {
            default_type application/json;
            return 403 '{"error":"forbidden","message":"Administrative endpoints are restricted to internal networks."}\n';
        }

        # ----------------------------------------------------------------------
        # 7. Actuator Telemetry Endpoints (RESTRICTED - BLOCKED AT EDGE)
        # ----------------------------------------------------------------------
        location /actuator/ {
            default_type application/json;
            return 403 '{"error":"forbidden","message":"Actuator telemetry is restricted to internal networks."}\n';
        }

        # ----------------------------------------------------------------------
        # Default Fallback (Block unexpected paths at the perimeter)
        # ----------------------------------------------------------------------
        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Endpoint not exposed at perimeter proxy."}\n';
        }
    }
}
